<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaarWala - Fair Price Estimator</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --accent: #f97316; --accent2: #ec4899; --info: #0284c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); min-height: 100vh;
    background: radial-gradient(1200px 600px at 10% -10%, #ffe8d6 0%, var(--bg) 55%);
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  .hero {
    background: linear-gradient(135deg, #fff 0%, #fff4ec 100%); border: 1px solid var(--border);
    border-radius: 22px; padding: 2rem 2.25rem; margin-bottom: 1.5rem;
    box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
  }
  .hero h1 {
    margin: 0; font-size: 2.6rem; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2), #7c3aed);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin: .5rem 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 1.5rem 1.6rem; box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
  }
  .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; margin-bottom: .9rem; }
  .field label { font-size: .82rem; font-weight: 600; margin-bottom: .35rem; }
  input, select {
    font: inherit; padding: .65rem .75rem; border: 1px solid var(--border);
    border-radius: 10px; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid #fed7aa; border-color: var(--accent); }
  input:disabled { background: #f1f5f9; }
  .hidden { display: none !important; }
  button {
    width: 100%; padding: .9rem; border: none; border-radius: 12px; font: inherit; font-weight: 700;
    color: #fff; cursor: pointer; background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 20px rgba(236, 72, 153, .25);
  }
  button:disabled { opacity: .6; cursor: wait; }
  .errors {
    background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; border-radius: 14px;
    padding: .9rem 1.1rem; margin-bottom: 1rem; font-size: .92rem;
  }
  .errors div { margin: .25rem 0; }
  .warnings {
    background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; border-radius: 14px;
    padding: .8rem 1rem; margin-top: .8rem; font-size: .88rem;
  }
  .result {
    background: linear-gradient(160deg, #fff 0%, #fff7f0 100%); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.6rem;
  }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
  .chip {
    background: #eff6ff; border: 1px solid #bfdbfe; color: var(--info);
    padding: .25rem .6rem; border-radius: 8px; font-size: .78rem;
  }
  .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: 1.2px; }
  .price { font-size: 2.9rem; font-weight: 800; margin: .35rem 0 1.2rem; }
  .bar {
    position: relative; height: 10px; border-radius: 999px; margin: .6rem 0 .4rem;
    background: linear-gradient(90deg, #cbd5e1, var(--accent), var(--accent2));
  }
  .dot {
    position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    border: 3px solid var(--accent); transform: translate(-50%, -50%);
    box-shadow: 0 4px 10px rgba(15, 23, 42, .2);
  }
  .ends { display: flex; justify-content: space-between; font-weight: 600; font-size: .9rem; }
  .verdict { border-radius: 14px; padding: .9rem 1.1rem; margin-top: 1rem; border: 1px solid; font-size: .92rem; }
  .verdict .vt { font-weight: 700; margin-bottom: .2rem; }
  .verdict.fair { border-color: #86efac; background: #f0fdf4; }
  .verdict.above { border-color: #fca5a5; background: #fef2f2; }
  .verdict.below { border-color: #93c5fd; background: #eff6ff; }
  .src { color: var(--muted); font-size: .8rem; margin-top: 1rem; }
  .placeholder { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  .placeholder .icon { font-size: 3rem; margin-bottom: .5rem; }
  .placeholder h3 { color: var(--text); margin: .2rem 0 .4rem; }
  .footer { color: var(--muted); font-size: .8rem; margin-top: 1.5rem; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>KaarWala</h1>
    <p>Know what a used car is really worth in Pakistan.</p>
  </header>

  <div class="grid">
    <form class="card" id="form" novalidate>
      <h2>Car details</h2>
      <div class="sub">Dropdowns use the exact values from the dataset.</div>

      <div class="row">
        <div class="field"><label for="brand">Brand</label><select id="brand"></select></div>
        <div class="field"><label for="model">Model</label><select id="model"></select></div>
      </div>
      <div class="field"><label for="variant">Variant</label><select id="variant"></select></div>

      <div class="row">
        <div class="field"><label for="year">Model year</label><input id="year" type="number" step="1"></div>
        <div class="field"><label for="mileage">Mileage (km)</label><input id="mileage" type="number" step="1000"></div>
      </div>

      <div class="row">
        <div class="field"><label for="fuel">Fuel type</label><select id="fuel"></select></div>
        <div class="field"><label for="transmission">Transmission</label><select id="transmission"></select></div>
      </div>

      <div class="field" id="engineField"><label for="engine">Engine (cc)</label><input id="engine" type="number" step="100"></div>

      <div class="field"><label for="city">City</label><select id="city"></select></div>

      <div class="field">
        <label for="asking">Seller's asking price (PKR, optional)</label>
        <input id="asking" type="number" min="0" step="50000" placeholder="Leave empty to skip">
      </div>

      <button type="submit" id="submit">Estimate fair price</button>
    </form>

    <section class="card result" id="output"></section>
  </div>

  <div class="footer">Estimate based on 10,589 listings. Not a valuation or financial advice.</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const output = $("output");
let OPTIONS = null;

const SOURCE_TEXT = {
  exact: "Market data: exact match for this model and year.",
  model: "Market data: model-level average (no exact year match).",
  none: "Market data: no listings for this model, overall averages used.",
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function fmtPkr(value) {
  return value >= 1e7
    ? "PKR " + (value / 1e7).toFixed(2) + " Cr"
    : "PKR " + (value / 1e5).toFixed(2) + " L";
}

function fillSelect(select, items, opts = {}) {
  select.innerHTML = "";
  if (opts.emptyLabel !== undefined) {
    const o = el("option", null, opts.emptyLabel);
    o.value = "";
    select.appendChild(o);
  }
  for (const item of items) {
    const o = el("option", null, item);
    o.value = item;
    select.appendChild(o);
  }
  if (opts.preferred && items.includes(opts.preferred)) select.value = opts.preferred;
}

function onBrandChange() {
  fillSelect($("model"), OPTIONS.models_by_brand[$("brand").value] || []);
  onModelChange();
}

function onModelChange() {
  const key = $("brand").value + "|" + $("model").value;
  fillSelect($("variant"), OPTIONS.variants[key] || [], { emptyLabel: "Not sure / not listed" });
}

function onFuelChange() {
  const electric = $("fuel").value === "Electric";
  $("engineField").classList.toggle("hidden", electric);
  $("engine").disabled = electric;
}

function renderPlaceholder() {
  output.innerHTML = "";
  const box = el("div", "placeholder");
  box.appendChild(el("div", "icon", "🔍"));
  box.appendChild(el("h3", null, "Ready when you are"));
  const p = el("div", null, "Fill in the details and press ");
  p.appendChild(el("b", null, "Estimate fair price"));
  p.appendChild(document.createTextNode("."));
  box.appendChild(p);
  output.appendChild(box);
}

function renderWarnings(list) {
  if (!list || list.length === 0) return;
  const box = el("div", "warnings");
  list.forEach((w) => box.appendChild(el("div", null, "⚠ " + w)));
  output.appendChild(box);
}

function renderErrors(errors, warnings) {
  output.innerHTML = "";
  const box = el("div", "errors");
  box.appendChild(el("strong", null, "Please fix the following:"));
  errors.forEach((e) => box.appendChild(el("div", null, "• " + e)));
  output.appendChild(box);
  renderWarnings(warnings);
}

function renderResult(d) {
  output.innerHTML = "";

  const chips = el("div", "chips");
  const mileageText = Number(d.car.mileage).toLocaleString() + " km";
  [d.car.brand + " " + d.car.model, String(d.car.year), mileageText,
   d.car.fuel_type, d.car.transmission, d.car.city]
    .forEach((t) => chips.appendChild(el("span", "chip", t)));
  output.appendChild(chips);

  output.appendChild(el("div", "label", "Estimated fair price"));
  output.appendChild(el("div", "price", fmtPkr(d.predicted_pkr)));

  output.appendChild(el("div", "label", "Likely range"));
  const span = d.range_high_pkr - d.range_low_pkr;
  let pos = span > 0 ? ((d.predicted_pkr - d.range_low_pkr) / span) * 100 : 50;
  pos = Math.min(Math.max(pos, 0), 100);
  const bar = el("div", "bar");
  const dot = el("div", "dot");
  dot.style.left = pos + "%";
  bar.appendChild(dot);
  output.appendChild(bar);

  const ends = el("div", "ends");
  ends.appendChild(el("span", null, fmtPkr(d.range_low_pkr)));
  ends.appendChild(el("span", null, fmtPkr(d.range_high_pkr)));
  output.appendChild(ends);

  if (d.verdict) {
    const v = d.verdict;
    const titles = { fair: "Looks fair", above: "Above market value", below: "Below market value" };
    const texts = {
      fair: "Asking price is within the typical error margin of the estimate.",
      above: "Asking is " + fmtPkr(Math.abs(v.difference_pkr)) + " (" + v.difference_pct + "%) above the estimate. Negotiate.",
      below: "Asking is " + fmtPkr(Math.abs(v.difference_pkr)) + " (" + Math.abs(v.difference_pct) + "%) below the estimate. Check the car's condition before buying.",
    };
    const box = el("div", "verdict " + v.status);
    box.appendChild(el("div", "vt", titles[v.status]));
    box.appendChild(el("div", null, texts[v.status]));
    output.appendChild(box);
  }

  output.appendChild(el("div", "src", SOURCE_TEXT[d.market_source] || ""));

  const notes = [...(d.warnings || [])];
  if (d.high_value) {
    notes.push("High-value car: the real error is usually much larger than the range shown.");
  }
  renderWarnings(notes);
}

async function loadOptions() {
  const res = await fetch("/options");
  OPTIONS = await res.json();

  fillSelect($("brand"), OPTIONS.brands);
  fillSelect($("fuel"), OPTIONS.fuel_types, { preferred: "Petrol" });
  fillSelect($("transmission"), OPTIONS.transmissions);
  fillSelect($("city"), OPTIONS.cities, { emptyLabel: "Choose a city" });

  const L = OPTIONS.limits;
  $("year").min = L.min_year; $("year").max = L.max_year; $("year").value = 2018;
  $("mileage").min = 0; $("mileage").max = L.max_mileage; $("mileage").value = 60000;
  $("engine").min = L.min_engine_cc; $("engine").max = L.max_engine_cc; $("engine").value = 1300;

  onBrandChange();
  onFuelChange();
}

$("brand").addEventListener("change", onBrandChange);
$("model").addEventListener("change", onModelChange);
$("fuel").addEventListener("change", onFuelChange);

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = $("submit");
  button.disabled = true;
  button.textContent = "Estimating…";

  const electric = $("fuel").value === "Electric";
  const askingRaw = $("asking").value.trim();
  const body = {
    brand: $("brand").value,
    model: $("model").value,
    variant: $("variant").value || null,
    year: parseInt($("year").value, 10),
    mileage_km: parseFloat($("mileage").value),
    fuel_type: $("fuel").value,
    transmission: $("transmission").value,
    engine_cc: electric ? null : parseFloat($("engine").value),
    city: $("city").value,
    asking_price_pkr: askingRaw === "" ? null : parseFloat(askingRaw),
  };

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      renderErrors(data.errors || [data.detail || "Something went wrong."], data.warnings);
    } else {
      renderResult(data);
    }
  } catch (err) {
    renderErrors(["Could not reach the server. Is uvicorn running?"]);
  } finally {
    button.disabled = false;
    button.textContent = "Estimate fair price";
  }
});

renderPlaceholder();
loadOptions().catch(() => renderErrors(["Could not load dropdown options. Is the server running?"]));
</script>
</body>
</html>
